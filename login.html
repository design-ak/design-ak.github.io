</svg><span class="brand-name">AK Design System</span><span class="c-badge" data-tone="info">Beta</span></div>
  <h1 class="login-title">Sign in</h1>
  <p class="login-lede">Use the team username and password you were given.</p>
  <form class="login-form" id="login-form" novalidate>
    <label class="c-field" id="f-user"><span class="c-field-label">Username</span>
      <span class="c-input"><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></span></label>
    <label class="c-field" id="f-pass"><span class="c-field-label">Password</span>
      <span class="c-input"><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon " viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M600.5-379.62q49.5-49.62 49.5-120.5T600.38-620.5Q550.76-670 479.88-670T359.5-620.38Q310-570.76 310-499.88t49.62 120.38q49.62 49.5 120.5 49.5t120.38-49.62Zm-200-41.12q-32.5-32.73-32.5-79.5 0-46.76 32.74-79.26 32.73-32.5 79.5-32.5 46.76 0 79.26 32.74 32.5 32.73 32.5 79.5 0 46.76-32.74 79.26-32.73 32.5-79.5 32.5-46.76 0-79.26-32.74ZM234.5-276Q124-352 57-470q-4-7.13-6-14.65-2-7.52-2-15.43 0-7.92 2-15.38 2-7.47 6-14.54 67-118 177.5-194T480-800q135 0 245.5 76T903-530q4 7.12 6 14.65 2 7.52 2 15.43 0 7.92-2 15.38-2 7.47-6 14.54-67 118-177.5 194T480-200q-135 0-245.5-76ZM480-500Zm222.5 174.5Q804-391 857-500q-53-109-154.33-174.5Q601.34-740 480.17-740T257.5-674.5Q156-609 102-500q54 109 155.33 174.5Q358.66-260 479.83-260t222.67-65.5Z"/></svg><svg class="icon " viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M600-620q29 29 42.5 71.5T647-464q0 13-8.5 21.5T617-434q-13 0-21.5-8.5T587-464q11-34 2.5-64.5T559-580q-21-22-52-30t-64 3q-13 0-21.5-8.5T413-637q0-13 8.5-21.5T443-667q42-9 85 4.5t72 42.5ZM490-740q-32 0-64 3t-63 13q-12 4-24-1t-17-16q-5-11 0-22.5t16-15.5q35-11 72-16t75-5q137 0 249.5 75.5T907-526q3 6 5 12.5t2 13.5q0 7-1.5 13.5T908-474q-23 49-55 90.5T779-307q-9 8-20 5.5T741-313q-7-9-5.5-20t10.5-19q36-30 65-66.5t46-81.5q-49-109-148-174.5T490-740Zm-10 540q-136 0-247.5-76T55-472q-4-7-5.5-13.5T48-500q0-8 2-14.5t5-13.5q24-48 55.5-90.5T182-696L77-801q-9-9-8.5-21t8.5-21q9-9 21.5-9t21.5 9l716 716q8 8 8 19.5T836-87q-8 10-20.5 10T794-86L648-229q-41 15-83 22t-85 7ZM223-654q-41 29-72 68t-49 86q52 112 156.5 176T488-260q29 0 58-1.5t55-14.5l-64-64q-14 6-28.5 8t-28.5 2q-71 0-120.5-49.5T310-500q0-14 2.5-28.5T320-557l-97-97Zm305 142Zm-116 58Z"/></svg></button></span>
      <span class="c-help" id="login-error" role="alert" hidden><svg class="icon " viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M503.5-289.48q9.5-9.48 9.5-23.5t-9.48-23.52q-9.48-9.5-23.5-9.5t-23.52 9.48q-9.5 9.48-9.5 23.5t9.48 23.52q9.48 9.5 23.5 9.5t23.52-9.48Zm1-152.15q8.5-8.62 8.5-21.37v-193q0-12.75-8.68-21.38-8.67-8.62-21.5-8.62-12.82 0-21.32 8.62-8.5 8.63-8.5 21.38v193q0 12.75 8.68 21.37 8.67 8.63 21.5 8.63 12.82 0 21.32-8.63ZM480.27-80q-82.74 0-155.5-31.5Q252-143 197.5-197.5t-86-127.34Q80-397.68 80-480.5t31.5-155.66Q143-709 197.5-763t127.34-85.5Q397.68-880 480.5-880t155.66 31.5Q709-817 763-763t85.5 127Q880-563 880-480.27q0 82.74-31.5 155.5Q817-252 763-197.68q-54 54.31-127 86Q563-80 480.27-80Zm.23-60Q622-140 721-239.5t99-241Q820-622 721.19-721T480-820q-141 0-240.5 98.81T140-480q0 141 99.5 240.5t241 99.5Zm-.5-340Z"/></svg><span></span></span></label>
    <button class="c-btn c-btn--primary c-btn--block" type="submit" id="login-btn"><span>Sign in</span></button>
  </form>
  <p class="login-foot">For the AK Mob App team. Ask the design team if you need access.</p>
</main>
<script>
(function () {
  var KEY = 'ak-ds-session', MKEY = 'ak-ds-master';
  var PAGES = /^(index|foundations|components|guidelines|handoff|settings)\.html(#[A-Za-z0-9_-]+)?$/;
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  var form = document.getElementById('login-form'), btn = document.getElementById('login-btn');
  var err = document.getElementById('login-error'), fu = document.getElementById('f-user'), fp = document.getElementById('f-pass');
  var pw = document.getElementById('password'), tg = document.querySelector('.pw-toggle');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    tg.setAttribute('aria-pressed', String(show)); tg.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  function fail(msg, both) {
    err.lastElementChild.textContent = msg; err.hidden = false;
    fp.classList.add('is-error'); fu.classList.toggle('is-error', !!both);
    btn.disabled = false; btn.firstElementChild.textContent = 'Sign in';
  }
  form.addEventListener('input', function () { err.hidden = true; fu.classList.remove('is-error'); fp.classList.remove('is-error'); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var user = document.getElementById('username').value.trim().toLowerCase(), pass = pw.value;
    if (!user || !pass) { fail('Enter your username and password.', !user); return; }
    if (!window.crypto || !crypto.subtle) { fail('Open this site over https in an up-to-date browser to sign in.'); return; }
    btn.disabled = true; btn.firstElementChild.textContent = 'Signing in…';
    var enc = new TextEncoder(), auth, key;
    function open(w) { var c = b64(w); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: c.slice(0, 12) }, key, c.slice(12)); }
    fetch('auth.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('auth'); return r.json();
    }).then(function (a) {
      auth = a;
      return crypto.subtle.importKey('raw', enc.encode(user + ':' + pass), 'PBKDF2', false, ['deriveKey']);
    }).then(function (km) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(auth.salt), iterations: auth.iterations, hash: 'SHA-256' }, km,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (k) {
      key = k;
      // each login unlocks its own copy of the site key; try them in turn
      return auth.users.reduce(function (p, u) {
        return p.catch(function () {
          return open(u.k).then(function (raw) {
            return u.m ? open(u.m).then(function (m) { return [raw, m]; }) : [raw, null];
          });
        });
      }, Promise.reject());
    }).then(function (keys) {
      var raw = keys[0];
      try {
        localStorage.setItem(KEY, toB64(raw));
        if (keys[1]) localStorage.setItem(MKEY, toB64(keys[1])); else localStorage.removeItem(MKEY);
      }
      catch (x) { fail('Your browser is blocking site data, so you can’t stay signed in. Allow site data for this site and try again.'); return; }
      var next = new URLSearchParams(location.search).get('next') || '';
      location.replace(PAGES.test(next) ? next : 'index.html');
    }).catch(function (e) {
      if (e && e.message === 'auth') fail('Couldn’t load the sign-in details. Check your connection and reload the page.');
      else fail('Username or password is incorrect. Check them and try again.', true);
    });
  });
})();
</script>
</body>
</html>
